name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Re-run CI suite on tagged commit
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo build --workspace --all-targets --locked
          cargo test --workspace --locked
          cargo build -p dependency-factory --no-default-features --locked

      - name: Verify tag matches workspace version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(cargo metadata --no-deps --format-version 1 \
                       | jq -r '.packages[] | select(.name == "dependency-factory") | .version')
          if [ "$tag" != "$manifest" ]; then
            echo "Tag v$tag does not match workspace version $manifest" >&2
            exit 1
          fi
          echo "Tag and manifest agree on version $manifest"

      - name: Publish dependency-factory-derive
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p dependency-factory-derive --locked

      - name: Wait for crates.io to index the proc-macro
        run: sleep 30

      - name: Publish dependency-factory
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p dependency-factory --locked

      - name: Extract changelog section for this release
        id: changelog
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # Pull the lines from "## [VERSION]" up to (but not including) the
          # next "## [" heading. Drops the heading itself so the GitHub
          # Release body is just the body of that section.
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## \[/        { exit }
            found                    { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No changelog section found for version $version" >&2
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
